services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duarte_imoveis_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - QUEUE_CONNECTION=database
    command: >
      sh -c "php -r \"file_exists('database/database.sqlite') || touch('database/database.sqlite');\" &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duarte_imoveis_queue
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - QUEUE_CONNECTION=database
    depends_on:
      - app
    command: php artisan queue:work --tries=3 --timeout=120
